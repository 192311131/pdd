<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Layer Gradients -->
    <linearGradient id="logo-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    
    <linearGradient id="logo-grad-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#05ffd5" />
    </linearGradient>
    
    <linearGradient id="logo-grad-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05ffd5" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>

    <linearGradient id="logo-scan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05ffd5" stop-opacity="0" />
    </linearGradient>

    <!-- Glow filter for scan line -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tooth Mask -->
    <mask id="logo-tooth-mask">
      <path 
        d="M 50 12 C 37 12, 28 15, 23 23 C 18 31, 21 56, 25 78 C 27 85, 37 87, 50 87 C 63 87, 73 85, 75 78 C 79 56, 82 31, 77 23 C 72 15, 63 12, 50 12 Z" 
        fill="#ffffff" 
      />
    </mask>
  </defs>

  <!-- Main Layered Tooth under Mask -->
  <g mask="url(#logo-tooth-mask)">
    <!-- Top Cervical/Dentine Layer -->
    <path d="M 0 0 L 100 0 L 100 36 C 70 40, 30 40, 0 36 Z" fill="url(#logo-grad-top)" />
    
    <!-- Middle Body Layer -->
    <path d="M 0 40 C 30 44, 70 44, 100 40 L 100 61 C 70 65, 30 65, 0 61 Z" fill="url(#logo-grad-mid)" />
    
    <!-- Bottom Incisal/Enamel Layer -->
    <path d="M 0 65 C 30 69, 70 69, 100 65 L 100 100 L 0 100 Z" fill="url(#logo-grad-bot)" />

    <!-- Diagonal Scan Beam overlay inside the tooth -->
    <path d="M -10 35 L 110 65 L 110 70 L -10 40 Z" fill="url(#logo-scan-glow)" opacity="0.4" />
  </g>

  <!-- Outer Glow Highlight Scan Line -->
  <line 
    x1="12" y1="41" 
    x2="88" y2="69" 
    stroke="#ffffff" 
    stroke-width="2" 
    stroke-linecap="round" 
    filter="url(#logo-glow)"
    opacity="0.85"
  />

  <!-- Subtle digital crosshair corners (aesthetic accents) -->
  <path d="M 12 25 L 12 18 L 19 18" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 88 25 L 88 18 L 81 18" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 12 75 L 12 82 L 19 82" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 88 75 L 88 82 L 81 82" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
</svg>
